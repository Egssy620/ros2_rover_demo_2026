ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.1
    two_d_mode: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # LIO-SAM manages its own TF; avoid conflicts
    publish_tf: false
    publish_acceleration: false

    # Ranger Mini 3.0 wheel odometry
    odom0: /odom
    odom0_config: [true,  true,  false,   # x, y, z
                   false, false, true,    # roll, pitch, yaw
                   true,  true,  false,   # vx, vy, vz
                   false, false, true,    # vroll, vpitch, vyaw
                   false, false, false]   # ax, ay, az
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10
    odom0_nodelay: true

    # Livox Mid-360 built-in IMU — orientation (roll/pitch) and yaw rate only.
    # linear_acceleration is NOT fused here; raw values are passed through to
    # LIO-SAM by the odom_imu_fuser node for GTSAM IMU preintegration.
    imu0: /livox/imu
    imu0_config: [false, false, false,   # x, y, z
                  true,  true,  false,   # roll, pitch, yaw
                  false, false, false,   # vx, vy, vz
                  false, false, true,    # vroll, vpitch, vyaw
                  false, false, false]   # ax, ay, az
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 50
    imu0_nodelay: true
    imu0_remove_gravitational_acceleration: true

